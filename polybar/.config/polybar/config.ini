[bar/infobar]
width = 100%
height = 20pt
background = #000000
foreground = #FFFFFF
padding-left = 1
padding-right = 1
module-margin = 2
bottom = true

font-0 = "monospace:size=9;2"
font-1 = "JetBrainsMono Nerd Font:size=10;2"

modules-left = xworkspaces
modules-center = date
modules-right = cpu memory filesystem network pulseaudio battery

[module/xworkspaces]
type = internal/xworkspaces
label-active = [%name%]
label-active-foreground = #FFFFFF
label-active-padding = 1
label-occupied = %name%
label-occupied-foreground = #888888
label-occupied-padding = 1
label-empty = %name%
label-empty-foreground = #333333
label-empty-padding = 1

[module/date]
type = internal/date
interval = 1
date = %a, %d %b %Y | %H:%M:%S
label = %date%

[module/cpu]
type = internal/cpu
interval = 2
label =  %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
label =  %percentage_used:2%%

[module/filesystem]
type = internal/fs
mount-0 = /
interval = 30
label-mounted = 󰋊 %percentage_used%%
label-unmounted = 󰋊 %mountpoint% unmounted

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-muted = 󰝟 Muted
label-muted-foreground = #888888

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾

[module/network]
type = custom/script
exec = ~/.config/polybar/net.sh
interval = 5

[module/battery]
type = custom/script
exec = ~/.config/polybar/battery.sh
interval = 10

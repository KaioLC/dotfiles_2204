[bar/infobar]
width = 100%
height = 24pt
background = #000000
foreground = #FFFFFF
padding-left = 1
padding-right = 1
module-margin = 1
bottom = true

font-0 = "monospace:size=8;2"

modules-left = xworkspaces
modules-center = date
modules-right = cpu memory rede

[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-background = #313244
label-active-padding = 2
label-occupied = %name%
label-occupied-padding = 2
label-empty = %name%
label-empty-foreground = #6C7086
label-empty-padding = 2

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S
label = %date%

[module/cpu]
type = internal/cpu
interval = 2
label = CPU %percentage%%

[module/memory]
type = internal/memory
interval = 2
label = RAM %percentage_used%%

[module/rede]
type= internal/network

interface = eno1
interval = 1


# using %essid% while in wireless
label-connected = %local_ip% %downspeed% %upspeed%
labe-connected-foreground = #A6E3A1

label-disconnected = No Network
label-disconnected-foreground = #F38BA8




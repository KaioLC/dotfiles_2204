# === Barra de Abas (Tabs) ===
# Posição da barra (bottom ou top)
tab_bar_edge bottom

# Estilos possíveis: fade, slant, separator, powerline, custom, hidden
tab_bar_style powerline
tab_powerline_style slanted

# Cores da aba ativa (foco)
active_tab_foreground   #ffffff
active_tab_background   #555555
active_tab_font_style   bold

# Cores das abas inativas
inactive_tab_foreground #888888
inactive_tab_background #000000
inactive_tab_font_style normal

# Cor de fundo da barra inteira
tab_bar_background      #000000  
# Oculta a barra completamente se houver apenas 1 aba aberta
tab_bar_min_tabs 2

# Usa um separador de texto limpo em vez de blocos desenhados
tab_bar_style separator
tab_separator "  |  "

# Cores: Fundo 100% preto fundindo com o terminal
active_tab_foreground   #ffffff
active_tab_background   #000000
active_tab_font_style   bold

inactive_tab_foreground #555555
inactive_tab_background #000000
inactive_tab_font_style normal

tab_bar_background      #000000

# copiar algo terminal > neovim
scrollback_pager nvim -c "set nonumber nolist showtabline=0 foldcolumn=0|autocmd TermOpen * startinsert" -c "autocmd TermClose * call cursor(max([0,Y-H+W]), C) | exe 'normal! zt'" -c "terminal sed </dev/fd/63 -e 's/'$'\x1b'']8;;file:[^\]*[\]//g' && sleep 0.01 && printf '\"$'\x1b'']2;\"'" -c "map <silent> q :qa!<CR>"

# Fix para remover bordas pretas do terminal
placement_strategy top-left
window_margin_width 0
window_padding_width 0

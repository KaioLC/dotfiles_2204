# --- Sombras ---
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.60;
shadow-offset-x = -12;
shadow-offset-y = -12;

# Não colocar sombra na Polybar (tipo dock)
shadow-exclude = [
    "window_type = 'dock'"
];

# --- Transparência ---
# Deixa janelas inativas levemente transparentes
inactive-opacity = 0.95;
active-opacity = 1.0;

# Força o Kitty a sempre ter um pouco de transparência
opacity-rule = [
    "90:class_g = 'kitty' && focused",
    "85:class_g = 'kitty' && !focused"
];

# --- Cantos Arredondados ---
corner-radius = 0;
rounded-corners-exclude = [
    "window_type = 'dock'"
];

# --- Desempenho ---
# Usar a placa de vídeo para renderizar e evitar "rasgos" na tela (Screen Tearing),
# o que é excelente para quando você for jogar ZZZ ou HSR depois!
backend = "glx";
vsync = true;
